name: Security audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install advisory scanner
        run: python -m pip install pip-audit==2.10.1
      - name: Audit pinned runtime, test and browser inventories without installing them
        shell: bash
        run: |
          for lock in scrapper/requirements.lock scrapper/requirements.test.lock ops/host/browser-requirements.lock scrapper/research/subsector_ss02/requirements.txt; do
            pip-audit --requirement "$lock" --no-deps --disable-pip
          done

  secrets:
    # Prevent new exposures; historical findings are documented separately.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download checksum-verified Gitleaks
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan every introduced commit with values fully redacted
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          if [[ -z "$SCAN_BASE" || "$SCAN_BASE" =~ ^0+$ ]]; then
            scan_range="$SCAN_HEAD"
          else
            scan_range="$SCAN_BASE..$SCAN_HEAD"
          fi
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact=100 \
            --ignore-gitleaks-allow --log-opts="$scan_range"
