name: Migration lineage

on:
  push:
  pull_request:

jobs:
  migration-lineage:
    runs-on: ubuntu-latest
    # Keep every application write target inside this disposable CI job root.
    env:
      TRADING_AI_ENV: test
      TRADING_AI_TEST_ROOT: ${{ runner.temp }}/trading-ai-test
      SCRAPER_STORE_PATH: ${{ runner.temp }}/trading-ai-test/store
      SCRAPER_FILES_PATH: ${{ runner.temp }}/trading-ai-test/store/files
      SCRAPER_SNAPSHOTS_PATH: ${{ runner.temp }}/trading-ai-test/store/snapshots
      SCRAPER_EXPORTS_PATH: ${{ runner.temp }}/trading-ai-test/store/exports
      SCRAPER_DB_PATH: ${{ runner.temp }}/trading-ai-test/state/scraper.db
      SCRAPER_DOCUMENT_STORE_PATH: ${{ runner.temp }}/trading-ai-test/documents
      SCRAPER_CAMPAIGNS_PATH: ${{ runner.temp }}/trading-ai-test/store/campaigns
      SCRAPER_LOGS_PATH: ${{ runner.temp }}/trading-ai-test/store/logs
      SCRAPER_BROWSER_STATE_PATH: ${{ runner.temp }}/trading-ai-test/store/browser-state
      SCRAPER_BACKUPS_PATH: ${{ runner.temp }}/trading-ai-test/store/backups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare isolated CI data roots
        run: mkdir -p "$TRADING_AI_TEST_ROOT"
      - name: Check frozen migration filenames and checksums
        run: python scripts/audit/check_migration_manifest.py
      - name: Check disposable ledger expectations
        run: python -m unittest scrapper.tests.test_migration_manifest -v
      - name: Check explicit migration and read-only connection controls
        run: python -m unittest scrapper.tests.test_database_migration_controls -v
      - name: Check rejected migration source and archive drift
        run: python -m unittest discover -s scripts/audit -p test_migration_lineage.py -v
