name: ML readiness

on:
  pull_request:
  push:
    branches: [main]

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    # init-db and the offline test suite must use isolated test targets.
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TRADING_AI_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12.14' }
      - name: Install locked offline dependencies
        run: |
          python -m pip install --require-hashes --requirement scrapper/requirements.test.lock
          python -m pip check
      - name: Migrate a database from zero
        run: python -m scrapper.cli init-db --db /tmp/ml-readiness.sqlite
      - name: Complete offline suite
        run: python -m unittest discover -s scrapper/tests -t . -v
      - name: Data-integrity and fixture gates
        run: python -m unittest scrapper.tests.test_ml_reporting_contract -v
